# ~/.config/jarvis-os/settings.toml     chmod 0600

[voice]
# ⚠️ Con `true` il core apre il MICROFONO all'avvio e spawna un processo
# `claude` persistente (§5.2). Parte spento di proposito: si accende qui.
enabled = false

stt_provider = "deepgram"        # primario
tts_provider = "deepgram"
fallback_on_error = true         # ricade sul locale su errore, chiave assente o rete giu'
fallback_stt = "local"
fallback_tts = "local"
deepgram_stt_model = "flux-general-multi"   # supporta l'italiano
eot_threshold = 0.7
eager_eot = false                # true = +50-70% chiamate LLM
whisper_model = "base"           # solo fallback
kokoro_voice  = "bm_george"      # solo fallback

[voice.wake]
model = "~/.local/share/jarvis-os/vosk-model-small-it-0.22"
confirm_tone_ms = 80
log_triggers = true

[[voice.wake.phrases]]
say = "jarvis"
action = "listen"

[[voice.wake.phrases]]
say = "papa e a casa"
action = "scene:avvio"          # la sola scena DICHIARATA in moduli.js

[[voice.wake.phrases]]
say = "jarvis buonanotte"
action = "scene:avvio"          # idem: una scena che non esiste non fa niente

[[voice.wake.phrases]]
say = "jarvis silenzio"
action = "mute"

[llm]
backend = "claude_code"
t1_model = "claude-haiku-4-5-20251001"
t1_cwd   = "~/.local/share/jarvis-os/voice-cwd"
t1_persona = "~/.config/jarvis-os/voice-persona.md"
t2_model = "sonnet"
max_concurrent_t2 = 2
max_t2_spawns_per_hour = 15

[fs]
workspace = "~/JARVIS"
allowed_roots = ["~/JARVIS", "~/Documenti", "~/Scaricati"]
trash_only = true                # nessun delete permanente

[vision]
# ⚠️ Con `true` il core apre la TELECAMERA quando una gesture lo richiede.
# Fase 7 ha la spia e il consenso, ma il consenso migliore e' non accenderla.
enabled = false
scope = "app"                    # solo la finestra di JARVIS
engine = "tesseract"

[news]
enabled = true
max_interruptions_per_hour = 3
topic_ttl_minutes = 30

[code]
# ⚠️ Con `true` l'LLM puo' far ESEGUIRE del codice che ha scritto lui.
# E' l'unico posto del sistema dove succede. La sandbox e i tetti ci sono
# (ADR-008, ADR-009), ma la difesa piu' semplice e' che il tool non esista:
# spento, non e' nemmeno nell'elenco che l'LLM riceve.
# Va riavviato il core dopo averlo cambiato: la registrazione, a differenza
# dei tetti qui sotto, non si ricarica a caldo.
enabled = false

# I tetti del tool. Sono politica: l'LLM chiede, questi decidono quanto ottiene.
tmpfs_mb = 64                    # la directory di lavoro e' RAM
memory_mb = 512                  # MemoryMax del cgroup — deve stare >= tmpfs_mb + 64
cpu_percent = 50                 # CPUQuota, in percentuale di UN core
max_output_kb = 64               # lo stdout torna nel contesto dell'LLM
max_timeout_s = 10.0             # tetto al timeout richiesto
max_concurrent = 2               # esecuzioni insieme

[ui]
target_fps = 60
grid_px = 110
gap_px = 8

# ── §26.6 — le scene ─────────────────────────────────────────────────────────
#
# Un nome, un insieme di pannelli, e per ognuno una geometria. Le celle sono
# [colonna, riga, colonne, righe] su una griglia 12x4: non pixel, cosi' la
# stessa scena compone uno schermo qualunque.
#
# ⚠️ Le celle SI SOVRAPPONGONO DI PROPOSITO. Non e' una piastrellatura: e' la
# composizione di `docs/design-reference/famiglia-a/01`, dove le carte si
# coprono in parte e tre o quattro restano leggibili per intero. Chi trovasse
# due pannelli sulle stesse colonne e volesse "sistemare" la griglia
# distruggerebbe proprio la cosa cercata.
#
# JARVIS richiama scene DICHIARATE, non ne inventa: §26.6, e ADR-006 dice
# perche' — il renderer non esegue una geometria prodotta da un LLM.

# Quale scena compone la scrivania al primo avvio, quando non c'e' un layout
# salvato da rimettere.
#
# ⚠️ Senza questa riga la scrivania apre TUTTO, ed e' cosi' che si e' scoperto
# che «aprire tutto» non e' comporre: quattordici pannelli, ognuno con la
# propria cella su una piastrellatura completa, diventano una CASCATA
# diagonale, e di quattordici se ne leggono due. Il difetto non erano le
# quattro pagine di ADR-010 — era che niente componeva.
scena_iniziale = "avvio"

[[ui.scene]]
nome = "avvio"
descrizione = "cosa vive, cosa succede, dove — e il resto a un clic dal catalogo"
# Tre leggibili per intero (globo, telemetria, anelli) e due sovrapposizioni
# volute: `agenti` copre `globo` di una colonna, `news` copre `agenti` di una
# colonna. La meta' bassa di `agenti` e `news` passa sotto al catalogo,
# lasciando scoperta la propria testa — che e' la maniglia.
#
# ⚠️ La fascia bassa AI LATI del catalogo e' larga due colonne, cioe' 256 px, e
# la min-width piu' piccola del sistema e' 330: nessun pannello ci sta. Quella
# fascia e' il fondo di §26.5 — le icone libere e le cartelle manila, che nel
# riferimento stanno esattamente li'.
pannelli = [
  { id = "globo",      cella = [0, 0, 4, 3], z = 1 },
  { id = "telemetria", cella = [4, 0, 5, 2], z = 2 },
  { id = "anelli",     cella = [8, 0, 4, 2], z = 3 },
  { id = "agenti",     cella = [3, 2, 5, 2], z = 2 },
  { id = "news",       cella = [8, 2, 4, 2], z = 3 },
]

[[ui.scene]]
nome = "briefing"
descrizione = "il mattino: cosa e' successo, cosa scotta, cosa c'e' oggi"
# Le tre celle di §26.6, alla lettera: news 0-5, telemetria 5-9, agenti 8-12.
pannelli = [
  { id = "news",       cella = [0, 0, 5, 3], z = 3 },
  { id = "telemetria", cella = [5, 0, 4, 2], z = 2 },
  { id = "agenti",     cella = [8, 1, 4, 2], z = 1 },
]

[[ui.scene]]
nome = "officina"
descrizione = "3D e progetti: il globo grande, la tavola, i piani d'archivio"
pannelli = [
  { id = "globo",     cella = [0, 0, 6, 3], z = 1 },
  { id = "periodica", cella = [5, 0, 7, 3], z = 2 },
  { id = "archivio",  cella = [0, 2, 5, 2], z = 3 },
  { id = "sorgente",  cella = [8, 2, 4, 2], z = 3 },
]

[meteo]
# §26 — la sorgente del pannello meteo. Open-Meteo: nessuna chiave API,
# nessun account, nessuna dipendenza nuova (urllib, come i collector RSS).
enabled = true

# ⚠️ NESSUNA POSIZIONE PREDEFINITA, ed e' voluto. Senza queste due righe il
# tool `weather` **non si registra** e il pannello resta al proprio stato
# vuoto: la prima chiamata di rete di questo sottosistema avviene solo dopo
# che le hai scritte tu. Una posizione predefinita — Roma, Greenwich,
# qualunque — sarebbe un dato inventato che sembra vero, e mostrerebbe il
# tempo di un posto in cui non sei (invariante 23).
#
# Gradi decimali. Vanno insieme: una sola delle due e' un errore, e lo schema
# la rifiuta invece di lasciarti un pannello vuoto senza spiegazione.
# latitude = 45.4642
# longitude = 9.1900
# nome = "Milano"

units = "celsius"

# ── ADR-007 — server MCP ─────────────────────────────────────────────────────
#
# ⚠️ Con `true` il core avvia PROGRAMMI DI TERZI e mette dei loro tool a
# portata dell'LLM. Parte spento di proposito, come voce, codice e vision, e
# non si accende dalla pagina impostazioni: si accende qui.
#
# I server PROPONGONO, il registry DISPONE: un tool diventa invocabile solo se
# e' nominato in `promossi`, uno per volta, e `side_effect` lo decidi tu — non
# il server, che non ha titolo per dichiarare innocua la propria operazione.
#
# Il comando va spezzato in una lista: una stringa sola andrebbe passata a una
# shell, e una shell in mezzo e' un modo di eseguire cio' che non hai scritto.
#
# [mcp]
# enabled = false
#
# [[mcp.servers]]
# nome = "esempio"
# comando = ["python", "-m", "il_mio_server_mcp"]
# promossi = [
#   { tool = "cerca", side_effect = false },
#   { tool = "scrivi", side_effect = true },   # passera' dalla conferma di §6.2
# ]

# ── I protocolli dichiarati ──────────────────────────────────────────────────
#
# Nei due film JARVIS non improvvisa mai un'azione che tocchi il mondo: le due
# volte in cui lo fa — «House Party Protocol», «Clean Slate Protocol» — esegue
# un comando che Tony aveva scritto MESI PRIMA e che richiama per nome.
#
# Qui e' lo stesso. Un protocollo guarda una cosa e parla SOLO quando quella
# cosa cambia: e' la forma della tossicita' del sangue di Iron Man 2, un numero
# sorvegliato che si dice quando si muove. Il primo giro non dice niente —
# non e' un cambiamento, e' un primo valore.
#
#   nome      come lo chiami
#   innesco   `risveglio` (la scrivania si collega) o `notte` (alle 04:00)
#   tool      SOLO uno dei tool osservativi di `core/protocolli.py`.
#             ⚠️ Non basta che non tocchi il disco: `open_web` non lo tocca e
#             apre una pagina, e infatti e' escluso.
#   args      gli argomenti del tool
#   frase     che cosa JARVIS dice quando trova un cambiamento. La scrive Lei:
#             JARVIS non compone una spiegazione di una cosa che non ha deciso
#             lui di sorvegliare.
#
# Una dichiarazione storta viene RIFIUTATA a voce alta (`protocollo_rifiutato`
# nel journal), non ignorata: un sorvegliante che non sorveglia e nessuno lo sa
# e' peggio di nessun sorvegliante.

[[protocolli]]
nome = "ronda degli scaricati"
innesco = "risveglio"
tool = "list_dir"
args = { path = "~/Scaricati" }
frase = "e' cambiato qualcosa in Scaricati"

[[protocolli]]
nome = "ronda dei documenti"
innesco = "notte"
tool = "list_dir"
args = { path = "~/Documenti" }
frase = "e' cambiato qualcosa in Documenti"

# JARVIS OS — core Python.
#
# NON e' un pacchetto distribuibile: e' un'applicazione che gira da questo
# repository come servizio systemd utente (SPEC §22 Fase 9, §19 uso personale).
# Percio' `package = false` e nessun build backend: costruire una wheel per
# qualcosa che non verra' mai installato altrove e' cerimonia senza scopo.

[project]
name            = "jarvis-os"
version         = "0.1.0"
description     = "Ambiente cognitivo desktop — core Python"
readme          = "CLAUDE.md"

# 3.12 e non 3.13: MediaPipe non ha wheel oltre 3.12 (SPEC §4, ADR-001).
# Il limite superiore e' esplicito perche' il vincolo va scoperto qui, non
# alla Fase 7 con dieci settimane di core gia' scritte.
requires-python = ">=3.12,<3.13"

# Dipendenze del SOLO core. asyncio e tomllib sono stdlib e non si dichiarano.
# Ogni riga che non serve alla Fase 0 e' comunque nella specifica §4: qui non
# si aggiunge nulla che §4 non elenchi (CLAUDE.md, "non fare senza chiedere").
dependencies = [
    "pydantic>=2.9",      # schema delle impostazioni, SecretStr
    "structlog>=24.4",    # log strutturato — mai print
    "psutil>=6.0",        # telemetria e sensori di temperatura
    "websockets>=13.0",   # trasporto core <-> Electron (Fase 1)
    "tomlkit>=0.13",      # TOML in lettura E scrittura, commenti preservati
    "watchdog>=5.0",      # hot reload delle impostazioni
    "send2trash>=2.1.0",
    "vosk>=0.3.45",
    "edge-tts>=7.2.8",
    "langgraph>=1.2.11",
    "mediapipe>=1.0.1",
    # ADR-014, §17.3. `trimesh` scrive il GLB e valida la topologia
    # (`is_watertight`, `euler_number`) con la sola numpy: non apre un contesto
    # GL e non vive nel renderer, quindi non e' un secondo motore 3D
    # (invariante 10) — e' I/O e validazione, come `send2trash` per i file.
    # `pygltflib` NON entra: il verificatore di ADR-012 rilegge il GLB con
    # `struct` e `json` della libreria standard, ed e' indipendente dallo
    # scrittore proprio per questo.
    "trimesh>=4.5",
    # C'era gia', trascinata da mediapipe. Dichiararla e' la differenza fra una
    # dipendenza e una coincidenza: `core/model3d/` la usa direttamente.
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths   = ["tests"]
# ⚠️ **Gli eval non venivano raccolti**, e per due giorni cinque di loro sono
# stati rossi senza che nessuno lo sapesse. Il default di pytest e' `test_*.py`,
# e i file si chiamano `eval_*.py` e `t0_corpus.py`: il marker qui sotto diceva
# «girano con tutto il resto» — e non era vero.
#
# §22 li chiama «l'unico modo di accorgersi che una sessione ha rotto qualcosa
# che funzionava tre fasi fa», e dice di farli girare all'INIZIO di ogni fase.
# Una suite che nessuno esegue non se ne accorge di niente.
python_files = ["test_*.py", "eval_*.py", "t0_corpus.py"]
pythonpath  = ["."]        # il progetto non e' installato: la root basta
asyncio_mode = "auto"
filterwarnings = ["error"] # un DeprecationWarning ignorato oggi e' un bug fra un anno
markers = [
  # Gli eval visivi che aprono un browser: secondi, non millisecondi. Girano
  # con tutto il resto, ma si possono escludere con -m "not slow" quando si
  # lavora su una singola funzione.
  "slow: apre un browser vero (eval_visual)",
]

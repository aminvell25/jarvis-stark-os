<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>JARVIS OS — galleria componenti</title>

<!-- L'ordine conta. fonts.css dichiara le @font-face, tokens.css le usa.
     Nessun altro CSS precede i token: invariante 18. -->
<link rel="stylesheet" href="./src/style/fonts.css">
<link rel="stylesheet" href="./src/style/tokens.css">
<!-- Librerie di terzi: la galleria deve renderle come le rende l'app, o
     giudicherebbe un componente diverso da quello che gira. -->
<link rel="stylesheet" href="./vendor/augmented-ui.min.css">
<link rel="stylesheet" href="./vendor/uPlot.min.css">
<link rel="stylesheet" href="./src/gallery/chrome.css">

<!-- Identica a quella di index.html: la galleria deve risolvere i moduli come
     li risolve l'app, o giudicherebbe un componente che in Electron non si
     carica nemmeno. Vedi scripts/vendor.mjs. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "d3-path": "./vendor/d3-path/index.js",
    "three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js"
  }
}
</script>
</head>
<body>
  <div id="barra"></div>
  <main id="palco"></main>
  <script type="module" src="./src/gallery/main.js"></script>
</body>
</html>
